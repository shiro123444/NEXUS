# ─── portal.wbuai.me → 本机 8080（用户门户）────────────────────────────────────
server {
    listen 127.0.0.1:443 ssl;
    listen 127.0.0.1:8443 ssl;
    server_name portal.wbuai.me;

    ssl_certificate     /etc/nginx/ssl/wbuai.pem;
    ssl_certificate_key /etc/nginx/ssl/wbuai.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Cloudflare 真实 IP 还原（让日志和应用能看到用户真实IP）
    real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket 支持（弹幕用到了）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式响应不缓冲
        proxy_buffering off;
        proxy_connect_timeout 300s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        send_timeout 600s;
    }
}

# ─── openai.wbuai.me → 单域名：前端 + CLIProxyAPI 后端分流 ─────────────────────
server {
    listen 127.0.0.1:443 ssl;
    listen 127.0.0.1:8443 ssl;
    server_name openai.wbuai.me;

    ssl_certificate     /etc/nginx/ssl/wbuai.pem;
    ssl_certificate_key /etc/nginx/ssl/wbuai.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    real_ip_header CF-Connecting-IP;

    root /var/www/cliproxy;
    index index.html;

    # OpenAI-compatible API route → Billing Gateway (8300)
    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_connect_timeout 300s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        send_timeout 600s;
    }

    # Management API route
    location ^~ /v0/management/ {
        proxy_pass http://127.0.0.1:8317;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_connect_timeout 300s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        send_timeout 600s;
    }

    # Static assets → Portal Backend (8080) - game images, avatars etc.
    location ^~ /static/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_connect_timeout 300s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        send_timeout 600s;
    }

    # Portal API route → Portal Backend (8080)
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_connect_timeout 300s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        send_timeout 600s;
    }

    # Frontend SPA
    location / {
        try_files $uri /index.html;
    }
}

# ─── api.wbuai.me → 本机 8081（主代理）─────────────────────────────────────────
server {
    listen 127.0.0.1:443 ssl;
    listen 127.0.0.1:8443 ssl;
    server_name api.wbuai.me;

    ssl_certificate     /etc/nginx/ssl/wbuai.pem;
    ssl_certificate_key /etc/nginx/ssl/wbuai.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass http://127.0.0.1:8990;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式响应不缓冲（LLM 流式输出必需）
        proxy_buffering off;
        proxy_connect_timeout 300s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        send_timeout 600s;
    }
}
